
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的知识库</title>
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('knowledge-theme') || mode; } catch (_) {}
      if (!['light', 'dark', 'system'].includes(mode)) mode = 'system';
      document.documentElement.dataset.theme = mode === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
      document.documentElement.dataset.mode = mode;
    })();
  </script>

  <!-- 基础样式 -->
  <link rel="stylesheet"
        href="./theme/vendor/docsify-core.min.css">

  <!-- 中文阅读主题 -->
  <link rel="stylesheet"
        href="./theme/theme.css">

</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '我的知识库',
      homepage: 'HOME.md',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 0,
      auto2top: true,

      search: {
        paths: 'auto',
        placeholder: '搜索笔记',
        noData: '没有找到相关结果',
        depth: 4,
        namespace: 'my-notes'
      }
    };
  </script>

  <!-- Docsify 主程序 -->
  <script src="./theme/theme.js"></script>
  <script src="./theme/vendor/docsify.min.js"></script>
  <script src="./theme/vendor/prism-bash.min.js"></script>
  <script src="./theme/vendor/prism-python.min.js"></script>
  <script src="./theme/vendor/prism-powershell.min.js"></script>
  <script src="./theme/vendor/prism-json.min.js"></script>
  <script src="./theme/vendor/prism-yaml.min.js"></script>
  <script src="./theme/vendor/prism-makefile.min.js"></script>
  <script src="./theme/vendor/prism-markdown.min.js"></script>
  <script src="./theme/vendor/prism-markup-templating.min.js"></script>
  <script src="./theme/vendor/prism-php.min.js"></script>
  <script src="./theme/vendor/prism-sql.min.js"></script>

  <!-- 全文搜索 -->
  <script src="./theme/vendor/search.min.js"></script>

</body>
</html>
