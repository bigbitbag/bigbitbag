
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的知识库</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '我的知识库',
      homepage: 'HOME.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        paths: 'auto',
        placeholder: '搜索笔记',
        noData: '没有找到相关结果',
        depth: 4,
        namespace: 'my-notes'
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
</body>
</html>
